<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Font Specimens</title>
<style>body{margin:0;min-height:100vh;padding:24px 16px;background:linear-gradient(#3a3570,#a2678a 70%,#f0a978);color:#fff8ee;font-family:system-ui}
.row{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.n{font-size:clamp(44px,7vw,92px);line-height:1.05;text-shadow:0 0 30px rgba(255,220,240,.45)}small{opacity:.75;font-size:13px;letter-spacing:.15em;text-transform:uppercase;width:160px}</style></head><body>
<div class=row><small>cherry-bomb-one</small><span class=n style="font-family:'cherry-bomb-one'">Daniel Azran · Now</span></div>
<div class=row><small>modak</small><span class=n style="font-family:'modak'">Daniel Azran · Now</span></div>
<div class=row><small>sniglet</small><span class=n style="font-family:'sniglet'">Daniel Azran · Now</span></div>
<div class=row><small>rubik-bubbles</small><span class=n style="font-family:'rubik-bubbles'">Daniel Azran · Now</span></div>
<div class=row><small>hachi-maru-pop</small><span class=n style="font-family:'hachi-maru-pop'">Daniel Azran · Now</span></div>
<div class=row><small>coiny</small><span class=n style="font-family:'coiny'">Daniel Azran · Now</span></div>
<div class=row><small>rampart-one</small><span class=n style="font-family:'rampart-one'">Daniel Azran · Now</span></div>
<div class=row><small>bagel-fat-one</small><span class=n style="font-family:'bagel-fat-one'">Daniel Azran · Now</span></div>
<script src="../../assets/fonts/cloud-cherry-bomb-one-font.js"></script>
<script src="../../assets/fonts/cloud-modak-font.js"></script>
<script src="../../assets/fonts/cloud-sniglet-font.js"></script>
<script src="../../assets/fonts/cloud-rubik-bubbles-font.js"></script>
<script src="../../assets/fonts/cloud-hachi-maru-pop-font.js"></script>
<script src="../../assets/fonts/cloud-coiny-font.js"></script>
<script src="../../assets/fonts/cloud-rampart-one-font.js"></script>
<script src="../../assets/fonts/cloud-bagel-fat-one-font.js"></script>
<script>for (const [k, b] of Object.entries(window.CLOUD_FONTS)) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); new FontFace(k, u.buffer).load().then(f => document.fonts.add(f)); }</script></body></html>
